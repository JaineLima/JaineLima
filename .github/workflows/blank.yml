# Nome da Actions:
name: Snake Game

# Atualiza a cobrinha a cada 5 horas, ao subir na main ou manualmente.
on:
  schedule:
    - cron: "0 */5 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gera a cobrinha (versão clara e escura) a partir das contribuições.
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JaineLima
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publica os arquivos na branch output.
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
